# Habilitar solo una vez configurado el registro DNS de hogarchito.nerohm.com.ar.
# Certbot añadirá HTTPS: sudo certbot --nginx -d hogarchito.nerohm.com.ar --redirect
server {
    listen 80;
    listen [::]:80;
    server_name hogarchito.nerohm.com.ar;

    location / {
        proxy_pass http://127.0.0.1:8035;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
