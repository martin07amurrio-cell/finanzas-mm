name: Hogar MM validation
on:
  push:
    branches: [desarrollo/hogar-mm]
  pull_request:
    branches: [main]
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx eslint src/pages/hogar src/services/hogar.ts
      # Hay errores de ESLint previos en los módulos financieros antiguos.
      # Se validan por separado los archivos nuevos hasta completar esa limpieza.
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: python -m compileall -q backend/app backend/scripts backend/tests
      - run: PYTHONPATH=backend python -m unittest discover -s backend/tests
